name: Dagelijkse to-do-mail (Vandaag te doen in de boekwinkel)

on:
  workflow_dispatch:
    inputs:
      trigger_source:
        description: "Wordt door cron-job.org meegestuurd om een geplande run te herkennen"
        required: false
        type: string
        default: ""
  # timing via cron-job.org: elke ochtend 7:15 (Nederlandse tijd)

jobs:
  send-daily-todo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Stuur de to-do-mail
        run: python main.py send-daily-todo
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BOL_CLIENT_ID: ${{ secrets.BOL_CLIENT_ID }}
          BOL_CLIENT_SECRET: ${{ secrets.BOL_CLIENT_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          TRIGGER_SOURCE: ${{ github.event.inputs.trigger_source }}
          PYTHONUNBUFFERED: "1"
