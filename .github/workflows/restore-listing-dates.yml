name: Te koop sinds herstellen (eenmalig)

# Zet 'Te koop sinds' terug uit een CSV in de repo (herstel/…) van vóór de datumreset door Boekwinkeltjes (6-10-2026).
# Standaard een PROEFRUN. Zet 'echt_uitvoeren' op "ja" om door te voeren. Veilig opnieuw te draaien.
on:
  workflow_dispatch:
    inputs:
      bestand:
        description: "Pad van de CSV in de repo (kolommen id en listing_date)"
        required: false
        type: string
        default: "herstel/boeken_2026-10-02.csv"
      echt_uitvoeren:
        description: 'Zet op "ja" om echt te herstellen. Anders proefrun.'
        required: false
        type: string
        default: "nee"

jobs:
  restore-listing-dates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Datums herstellen
        run: python main.py restore-listing-dates "$BESTAND" "$ECHT_UITVOEREN"
        env:
          BESTAND: ${{ github.event.inputs.bestand }}
          ECHT_UITVOEREN: ${{ github.event.inputs.echt_uitvoeren }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PYTHONUNBUFFERED: "1"
