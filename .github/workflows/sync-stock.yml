name: Snelle voorraadsync (Boekwinkeltjes + Bol)

on:
  workflow_dispatch:
    inputs:
      trigger_source:
        description: "Wordt door cron-job.org meegestuurd om een geplande run te herkennen"
        required: false
        type: string
        default: ""
  # timing nu via cron-job.org, zie projectnotities

concurrency:
  group: boekwinkeltjes-sync
  cancel-in-progress: false

jobs:
  quick-stock-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run quick stock sync
        run: python main.py quick-stock-sync
        env:
          BOEKWINKELTJES_ENV: ${{ secrets.BOEKWINKELTJES_ENV }}
          BOEKWINKELTJES_API_KEY_SANDBOX: ${{ secrets.BOEKWINKELTJES_API_KEY_SANDBOX }}
          BOEKWINKELTJES_API_KEY_LIVE: ${{ secrets.BOEKWINKELTJES_API_KEY_LIVE }}
          BOL_CLIENT_ID: ${{ secrets.BOL_CLIENT_ID }}
          BOL_CLIENT_SECRET: ${{ secrets.BOL_CLIENT_SECRET }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          TRIGGER_SOURCE: ${{ github.event.inputs.trigger_source }}
          PYTHONUNBUFFERED: "1"
